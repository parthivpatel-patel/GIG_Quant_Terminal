services:
  gig:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GIG_BROKER_CONNECTIVITY_ENABLED: "false"
      GIG_DATA_DIR: /app/data
      GIG_DB_PATH: /app/data/gig.duckdb
      GIG_RESULTS_DIR: /app/results
    volumes:
      - gig-data:/app/data
      - gig-results:/app/results
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    stop_grace_period: 30s
volumes:
  gig-data:
  gig-results:
