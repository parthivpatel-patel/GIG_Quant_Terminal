name: CI

# Free GitHub-hosted runners on a public repository only. No secrets, no
# deployment, no provider or broker access, no paid runners or artifacts storage
# beyond the default retention.
on:
  push:
    branches: [main, "development/**", "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GIG_BROKER_CONNECTIVITY_ENABLED: "false"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[web,research,calendar,sequence,dev]" pyflakes
      - name: Build optional C++20 rolling kernel
        run: CXX=g++ python scripts/build_native.py
      - name: Ruff
        run: ruff check src tests scripts/build_native.py
      - name: Pyflakes
        run: pyflakes src tests
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Mypy (Sprint 9 and Global Intelligence modules)
        run: mypy --ignore-missing-imports src/gig/execution/cost_evidence.py src/gig/data/provenance.py src/gig/intel src/gig/service/intel_workspace.py src/gig/service/viz.py
      - name: Tests
        run: python -m pytest -p no:cacheprovider -rs --cov=gig --cov-branch --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node DOM smoke checks
        run: node scripts/check_terminal.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[web,research,dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Chromium Sprint 9 terminal workflows
        run: python scripts/browser_sprint9.py --evidence-dir /tmp/ci-browser-sprint9
      - name: Fetch pinned axe-core 4.10.3 (SHA-256 verified)
        env:
          AXE_SHA256: 880970c081707360e64f34cea25ff91892f5bc95675b0776925b9709dd8a68bb
        run: |
          mkdir -p /tmp/axe && cd /tmp/axe
          curl -fsSL https://registry.npmjs.org/axe-core/-/axe-core-4.10.3.tgz -o axe-core.tgz
          tar -xzf axe-core.tgz package/axe.min.js
          echo "$AXE_SHA256  package/axe.min.js" | sha256sum -c -
          printf '{"name":"axe-core","version":"4.10.3","license":"MPL-2.0","script_sha256":"%s"}\n' "$AXE_SHA256" > package/manifest.json
      - name: Chromium 3D Analytics Lab and Global Intelligence (offline, no provider requests, axe-core)
        run: python scripts/browser_global_3d.py --evidence-dir /tmp/ci-browser-global-3d --axe /tmp/axe/package/axe.min.js
      - name: Chromium regressions for the 2026-11-04 visual review defects
        run: python scripts/browser_stage_a_regressions.py --report /tmp/ci-browser-stage-a/report.json
      - name: Chromium market charts, command palette and navigation
        run: python scripts/browser_charts.py --evidence-dir /tmp/ci-browser-charts --axe /tmp/axe/package/axe.min.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            /tmp/ci-browser-sprint9
            /tmp/ci-browser-global-3d
            /tmp/ci-browser-stage-a
            /tmp/ci-browser-charts
